[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superbox"
version = "1.0.0"
description = "Discover, deploy, and test MCPs in isolated sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SuperBox Team"}
]
keywords = ["mcp", "fastapi", "gin", "docker", "cli", "security", "registry"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-dotenv",
    "boto3",
    "pydantic",
    "websockets",
]

[project.optional-dependencies]
cli = [
    "click",
    "requests",
    "bandit",
    "ggshield",
]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]
all = [
    "superbox[cli,dev]"
]

[project.scripts]
superbox = "superbox.cli.main:main"

[project.urls]
Homepage = "https://github.com/areebahmeddd/superbox.ai"
Documentation = "https://github.com/areebahmeddd/superbox.ai#readme"
Repository = "https://github.com/areebahmeddd/superbox.ai"
Issues = "https://github.com/areebahmeddd/superbox.ai/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["superbox*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
