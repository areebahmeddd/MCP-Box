# TODO: Create package.json at repo root for the superbox npm package before enabling this workflow.
# TODO: Rewrite proxy.py as a Node.js CLI (bin/superbox.js) so the package has no Python dependency.
# TODO: Update pull.py and test.py to write "command": "npx", "args": ["superbox", "--url", ...] instead of the absolute Python path.
name: Publish NPM Package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Node Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node Environment
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Extract Package Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm ci

      - name: Pack Package Distribution
        run: npm pack

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: "*.tgz"
          retention-days: 1

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    environment: npm

    steps:
      - name: Setup Node Environment
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download Distribution Artifact
        uses: actions/download-artifact@v7
        with:
          name: dist

      - name: Publish Package to npm
        run: npm publish *.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs: [build, publish]

    steps:
      - name: Display Publish Details
        run: |
          echo "CLI package published successfully!"
          echo "Package     : superbox"
          echo "Version     : ${{ needs.build.outputs.version }}"
          echo "Registry    : npm (https://www.npmjs.com/package/superbox)"
          echo "Triggered by: ${{ github.actor }}"
