name: Deploy Infrastructure

on:
  workflow_run:
    workflows:
      - Code Quality and Testing
    types:
      - completed
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    name: Check Relevant File Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should-run: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect Relevant File Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            FILES=$(git diff --name-only HEAD~1 HEAD)
            echo "$FILES"
            if echo "$FILES" | grep -qE '^src/superbox/aws/(lambda|proxy)\.py|\.github/workflows/infra\.yaml'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  infra-deploy:
    name: Trigger Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: check-changes
    if: ${{ needs.check-changes.outputs.should-run == 'true' }}

    steps:
      - name: Trigger SuperBox-Infra Workflow
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.INFRA_REPO_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'arush3218',
              repo: 'SuperBox-Infra',
              workflow_id: 'deploy.yaml',
              ref: 'main'
            });

            console.log('Infrastructure deployment triggered successfully!');
            console.log('Triggered by: ', context.sha);
            console.log('Repository: ', context.repo.repo);
