name: Publish Image

on:
  workflow_run:
    workflows:
      - Code Quality and Testing
    types:
      - completed
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check-changes:
    name: Check Relevant File Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should-run: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect Relevant File Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            FILES=$(git diff --name-only HEAD~1 HEAD)
            echo "$FILES"
            if echo "$FILES" | grep -qE '^backend/(src/superbox/server/|Dockerfile)|\.github/workflows/docker\.yaml'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: check-changes
    if: ${{ needs.check-changes.outputs.should-run == 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/superbox-server:latest
            ghcr.io/${{ github.repository_owner }}/superbox-server:${{ github.sha }}

  summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs: [check-changes, publish]

    steps:
      - name: Display Publish Details
        run: |
          echo "Docker image published successfully!"
          echo "Registry    : ghcr.io"
          echo "Image       : ${{ github.repository_owner }}/superbox-server"
          echo "Tags        : latest, ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
